
services:
  backend:
    build: ./backend
    container_name: dental-monitor-api
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: dental-monitor-web
    ports:
      - "3000:3000"
    depends_on:
      - backend
